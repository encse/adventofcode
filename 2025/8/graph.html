
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kruskal MST Viewer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #wrap {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100%;
    }
    #sidebar {
      padding: 12px;
      color: #ddd;
      background: rgba(0,0,0,0.65);
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    textarea {
      width: 100%;
      height: 55vh;
      background: #111;
      color: #eee;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    button {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #eee;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.18); }
    #graph { width: 100%; height: 100%; }
    .err { color: #ff8080; white-space: pre-wrap; margin-top: 8px; }
  </style>
</head>
<body>
<div id="wrap">
  <div id="sidebar">
    <div style="font-weight:600">3D points</div>
    <textarea id="input">
27279,20893,37416
30000,21000,36000
26000,20000,38000
28000,19000,37000
    </textarea>
    <button id="render">Render MST</button>
    <button id="fit">Fit</button>
    <div id="err" class="err"></div>
  </div>
  <div id="graph"></div>
</div>

<script type="module">
import ForceGraph3D from "https://esm.sh/3d-force-graph@1.79.0";

const el = document.getElementById("graph");
const ta = document.getElementById("input");
const errEl = document.getElementById("err");
const btn = document.getElementById("render");

/* ---------- Parsing ---------- */

function parsePoints(text) {
  const pts = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const parts = line.split(",").map(Number);
    if (parts.length !== 3 || parts.some(Number.isNaN)) {
      throw new Error(`Line ${i+1}: invalid coordinate`);
    }
    pts.push({ id: i, x: parts[0], y: parts[1], z: parts[2] });
  }
  return pts;
}

/* ---------- Kruskal (faithful to your PartTwo) ---------- */

function metric(a, b) {
  return (a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2;
}

function kruskal(points) {
  const parent = new Map();
  points.forEach(p => parent.set(p.id, p.id));

  function find(x) {
    while (parent.get(x) !== x) {
      parent.set(x, parent.get(parent.get(x)));
      x = parent.get(x);
    }
    return x;
  }

  function union(a, b) {
    parent.set(find(b), find(a));
  }

  const edges = [];
  for (let i = 0; i < points.length; i++) {
    for (let j = i+1; j < points.length; j++) {
      edges.push({
        a: points[i],
        b: points[j],
        w: metric(points[i], points[j])
      });
    }
  }

  edges.sort((e1, e2) => e1.w - e2.w);

  const mst = [];
  for (const e of edges) {
    if (find(e.a.id) !== find(e.b.id)) {
      union(e.a.id, e.b.id);
      mst.push(e);
      if (mst.length === points.length - 1) break;
    }
  }
  return mst;
}

/* ---------- Graph ---------- */

const Graph = ForceGraph3D()(el)
  .backgroundColor("#000")
  .nodeRelSize(1)
  .nodeVal(2)
  .nodeColor("#ffffff")
  .nodeOpacity(1)
  .linkColor("#ffeb3b")     // yellow edges
  .linkWidth(0.7)
  .linkOpacity(1)
  .enableNodeDrag(false)    // positions are fixed
  .onEngineStop(() => Graph.zoomToFit(600, 80));

function render() {
  errEl.textContent = "";
  try {
    const points = parsePoints(ta.value);
    const mst = kruskal(points);

    const SCALE = 1000;

    function computeCenter(points) {
        let sx = 0, sy = 0, sz = 0;
        for (const p of points) {
            sx += p.x;
            sy += p.y;
            sz += p.z;
        }
        const n = points.length || 1;
        return {
            x: sx / n,
            y: sy / n,
            z: sz / n
        };
    }

    const center = computeCenter(points);

    const nodes = points.map(p => ({
        id: p.id,

        // center + scale for rendering
        x: (p.x - center.x) / SCALE,
        y: (p.y - center.y) / SCALE,
        z: (p.z - center.z) / SCALE,

        fx: (p.x - center.x) / SCALE,
        fy: (p.y - center.y) / SCALE,
        fz: (p.z - center.z) / SCALE
    }));


    const links = mst.map(e => ({
      source: e.a.id,
      target: e.b.id
    }));

    Graph.graphData({ nodes, links });
    setTimeout(() => Graph.zoomToFit(600, 80), 50);
  } catch (e) {
    errEl.textContent = String(e.message ?? e);
  }
}

btn.addEventListener("click", render);
render();

const btnFit = document.getElementById("fit");
btnFit.addEventListener("click", () => {
  Graph.zoomToFit(300, 80);
});

window.addEventListener("resize", () => {
  Graph.zoomToFit(300, 80);
});
</script>
</body>
</html>
